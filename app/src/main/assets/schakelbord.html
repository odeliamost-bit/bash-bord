<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Schakelbord Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">



<style>
/* Layout: schakelkast-werkblad. Kopbalk met modi, palet links (tablet) of onder (telefoon), tekenvel vult de rest, uitlegkaart schuift erover. */
:root {
  --bg: #E9EEF2; --panel: #FBFCFD; --panel2: #F1F4F7; --ink: #17212B; --muted: #566473; --line: #C6D0D9;
  --grid: #AEBBC7; --wire: #44515F; --hot: #E2531B; --neg: #2C6FD6; --accent: #0E7480; --accent-ink: #FFFFFF;
  --ok: #24935A; --bad: #CC2E25; --warn: #C98A06; --body: #FFFFFF; --sel: #0E7480;
  --f-disp: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F151B; --panel: #172029; --panel2: #1D2832; --ink: #E4EAF0; --muted: #94A3B2; --line: #2B3844;
  --grid: #34434F; --wire: #8D9BA9; --hot: #FF7040; --neg: #5C9BFF; --accent: #3DBAC4; --accent-ink: #071417;
  --ok: #3FC37A; --bad: #FF5A4F; --warn: #F0B532; --body: #1B252F; --sel: #3DBAC4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F151B; --panel: #172029; --panel2: #1D2832; --ink: #E4EAF0; --muted: #94A3B2; --line: #2B3844;
  --grid: #34434F; --wire: #8D9BA9; --hot: #FF7040; --neg: #5C9BFF; --accent: #3DBAC4; --accent-ink: #071417;
  --ok: #3FC37A; --bad: #FF5A4F; --warn: #F0B532; --body: #1B252F; --sel: #3DBAC4; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; }

/* Kopbalk */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: auto; }
.brand b { font-family: var(--f-disp); font-weight: 700; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; }
.brand span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.modes { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.modes button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 62px; height: 50px;
  border: 0; background: transparent; border-radius: 9px; font-family: var(--f-disp); font-weight: 600; font-size: 15px;
  letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.modes button svg { width: 22px; height: 22px; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.acts { display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; min-width: 48px; padding: 0 12px;
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--r); font-family: var(--f-disp); font-weight: 600;
  font-size: 16px; letter-spacing: .03em; text-transform: uppercase; }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.bad { color: var(--bad); border-color: var(--bad); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .4; }

.main { flex: 1; min-height: 0; display: flex; position: relative; }
/* Palet */
.palette { width: 128px; flex: none; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line);
  padding: 8px; display: flex; flex-direction: column; gap: 6px; touch-action: pan-y;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); }
.palette h3 { margin: 6px 2px 0; font-family: var(--f-disp); font-weight: 600; font-size: 13px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted); }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel2);
  border-radius: var(--r); padding: 4px 2px 6px; user-select: none; -webkit-user-select: none; touch-action: inherit; }
.tile canvas { width: 56px; height: 56px; pointer-events: none; }
.tile span { font-size: 13px; line-height: 1.15; text-align: center; pointer-events: none; }
.stage { flex: 1; min-width: 0; position: relative; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.hint { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: center; pointer-events: none; }
.hint div { pointer-events: auto; display: flex; gap: 10px; align-items: center; max-width: 560px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 15px; line-height: 1.35;
  box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.hint button { border: 0; background: var(--panel2); border-radius: 8px; width: 40px; height: 40px; flex: none; font-size: 20px; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 52px; height: 52px; padding: 0; font-size: 26px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; font-family: var(--f-mono);
  font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.legend i { display: block; width: 70px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--wire), var(--hot)); }
.toasts { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px;
  align-items: center; width: min(92%, 480px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 15px;
  line-height: 1.35; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.toast.bad { background: var(--bad); color: #fff; }
.toast button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 8px; min-height: 36px; padding: 0 10px;
  font-family: var(--f-disp); font-weight: 600; text-transform: uppercase; }
/* Meetpaneel */
.meter { position: absolute; top: 64px; left: 10px; width: 220px; background: #262B22; color: #DCE8C8; border-radius: 14px;
  padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25); border: 3px solid #E0B11C; }
.meter .lcd { font-family: var(--f-mono); font-weight: 700; font-size: 30px; text-align: right; background: #B9C7A5; color: #1D2416;
  border-radius: 6px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
.meter p { margin: 6px 0 8px; font-size: 13px; line-height: 1.3; }
.meter .row { display: flex; gap: 6px; }
.meter .row button { flex: 1; min-height: 40px; border-radius: 8px; border: 0; background: #3A4133; color: #DCE8C8;
  font-family: var(--f-disp); font-weight: 600; text-transform: uppercase; }
/* Uitlegkaart */
.card { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 310px; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 26px rgba(0,0,0,.14); padding: 14px;
  display: flex; flex-direction: column; gap: 12px; }
.card header { display: flex; align-items: flex-start; gap: 8px; }
.card h2 { margin: 0; font-family: var(--f-disp); font-weight: 700; font-size: 24px; line-height: 1.05; text-wrap: balance; flex: 1; }
.card h2 small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 2px; }
.card .x { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); font-size: 22px; flex: none; }
.card p { margin: 0; font-size: 16px; line-height: 1.45; }
.chip { display: inline-block; font-family: var(--f-disp); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  border-radius: 6px; padding: 2px 8px; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.off { color: var(--muted); }
.vals { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; background: var(--panel2); border-radius: 10px; padding: 10px 12px;
  font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.vals dt { color: var(--muted); } .vals dd { margin: 0; text-align: right; font-weight: 700; }
.props { display: flex; flex-direction: column; gap: 8px; }
.props label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; }
.props select, .props input { min-height: 44px; min-width: 120px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); padding: 0 8px; }
.cacts { display: flex; flex-wrap: wrap; gap: 8px; }
.cacts .btn { flex: 1 1 auto; }
.hold { touch-action: none; user-select: none; -webkit-user-select: none; }
/* Vellen */
.sheet { position: absolute; inset: 0; background: rgba(10,16,22,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.sheet > div { background: var(--panel); border-radius: 16px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); }
.sheet h2 { margin: 0; font-family: var(--f-disp); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .02em; flex: 1; }
.sheet h3 { margin: 6px 0 0; font-family: var(--f-disp); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sheet .top { display: flex; align-items: center; gap: 8px; }
.ex { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--panel2);
  border-radius: 12px; padding: 10px 14px; min-height: 56px; }
.ex b { font-family: var(--f-disp); font-size: 20px; font-weight: 600; }
.ex span { font-size: 14px; color: var(--muted); line-height: 1.35; }
.saved { display: flex; flex-direction: column; gap: 6px; }
.saved .it { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; }
.saved .it div { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .it small { display: block; color: var(--muted); font-size: 12px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.row2 input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 0 12px; }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); padding: 8px;
  font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); font-size: 14px; }

@media (max-width: 760px) {
  .main { flex-direction: column-reverse; }
  .palette { width: auto; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: 0; border-top: 1px solid var(--line);
    touch-action: pan-x; padding-block: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .palette h3 { display: none; }
  .tile { width: 76px; flex: none; }
  .tile canvas { width: 44px; height: 44px; }
  .tile span { font-size: 12px; }
  .card { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 58%; }
  .modes button { min-width: 54px; }
  .btn .tx { display: none; }
  .legend { display: none; }
  .meter { top: auto; bottom: 70px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>

<script>
/* Schakelbord rekenkern: pure functies (MNA + Gauss), werkt in browser en node */
(function (root) {
  'use strict';

    for (var i = 0; i < (r & 3); i++) { var t = x; x = -y; y = t; }

      elems: function (c, T, add) {
        var k = add();
        return [{ k: 'V', a: k, b: T[1], v: 230, key: 'src' }, { k: 'R', a: k, b: T[0], r: 0.3, key: 'ri' },
          { k: 'R', a: T[1], b: T[2], r: 0.05, key: 'bond' }, { k: 'R', a: T[1], b: 0, r: 1e6 }];
      } },
    pot: { naam: 'Regelbare weerstand', letter: 'R', term: two(), box: [-1.1, -1.3, 1.1, 1.3], props: { R: 1000, Pmax: 1 },
      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: +c.props.R, key: 'main' }]; } },
    res: { naam: 'Weerstand', letter: 'R', term: two(), box: [-0.8, -1.3, 0.8, 1.3], props: { R: 220, Pmax: 0.25 },
      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: +c.props.R, key: 'main' }]; } },
    lamp: { naam: 'Lamp', letter: 'H', term: two(), box: [-1.1, -1.1, 1.1, 1.1], props: { Vn: 24, P: 5, kleur: 'geel' },
      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: c.props.Vn * c.props.Vn / c.props.P, key: 'main' }]; } },

      elems: function (c, T) {

        var vf = LED_KLEUR[c.props.kleur] || 2;
        if (c._on) return [{ k: 'R', a: T[0], b: T[1], r: LED_RS, key: 'rs' }, { k: 'I', a: T[1], b: T[0], i: vf / LED_RS }];
        return [{ k: 'R', a: T[0], b: T[1], r: 1e8, key: 'off' }];
      } },
    fuse: { naam: 'Zekering', letter: 'F', term: two(), box: [-0.8, -1.3, 0.8, 1.3], props: { In: 2 },
      elems: function (c, T) { return c.st.blown ? [] : [{ k: 'R', a: T[0], b: T[1], r: R_ON, key: 'main' }]; } },
    rcd: { naam: 'Aardlekschakelaar', letter: 'Q', term: [[-1, -3], [1, -3], [-1, 3], [1, 3]], tn: ['L', 'N', 'L', 'N'], box: [-1.8, -2.2, 1.8, 2.2], props: { mA: 30 },
      elems: function (c, T) {
        return c.st.trip ? [] : [{ k: 'R', a: T[0], b: T[2], r: R_ON, key: 'L' }, { k: 'R', a: T[1], b: T[3], r: R_ON, key: 'N' }];
      } },
    sw: { naam: 'Schakelaar', letter: 'S', term: two(), box: [-1.1, -1.2, 1.1, 1.2], props: { on: false },

      elems: function (c, T) { return [{ k: 'R', a: T[0], b: T[c.props.pos ? 2 : 1], r: R_ON, key: 'main' }]; } },

      elems: function (c, T) { return c.pressed ? [{ k: 'R', a: T[0], b: T[1], r: R_ON, key: 'main' }] : []; } },

      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: c.props.Uc * c.props.Uc / 1.5, key: 'main' }]; } },
    kmain: { naam: 'Hoofdcontacten (3-polig)', letter: 'K', term: [[-2, -2], [0, -2], [2, -2], [-2, 2], [0, 2], [2, 2]], tn: ['1', '3', '5', '2', '4', '6'], box: [-2.8, -2.2, 2.8, 2.2], props: { of: 'K1' },

    kno: { naam: 'Hulpcontact NO', letter: 'K', term: two(), box: [-1.1, -1.2, 1.1, 1.2], props: { of: 'K1' },
      elems: function (c, T, add, ctx) { return ctx.relayOn(c.props.of) ? [{ k: 'R', a: T[0], b: T[1], r: R_ON, key: 'main' }] : []; } },
    knc: { naam: 'Hulpcontact NC', letter: 'K', term: two(), box: [-1.1, -1.2, 1.1, 1.2], props: { of: 'K1' },
      elems: function (c, T, add, ctx) { return ctx.relayOn(c.props.of) ? [] : [{ k: 'R', a: T[0], b: T[1], r: R_ON, key: 'main' }]; } },
    buzz: { naam: 'Zoemer', letter: 'H', term: two(), box: [-1.1, -1.1, 1.1, 1.1], props: { Vn: 24 },
      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: c.props.Vn * c.props.Vn / 0.6, key: 'main' }]; } },
    motor: { naam: 'Motor', letter: 'M', term: two(), box: [-1.2, -1.2, 1.2, 1.2], props: { Vn: 24, P: 24 },
      elems: function (c, T) { return c.st.broken ? [] : [{ k: 'R', a: T[0], b: T[1], r: c.props.Vn * c.props.Vn / c.props.P, key: 'main' }]; } },
    vm: { naam: 'Voltmeter', letter: 'P', term: two(), tn: ['+', 'COM'], box: [-1.1, -1.1, 1.1, 1.1], props: {},
      elems: function (c, T) { return [{ k: 'R', a: T[0], b: T[1], r: 10e6, key: 'main' }]; } },
    am: { naam: 'Ampèremeter', letter: 'P', term: two(), tn: ['A', 'COM'], box: [-1.1, -1.1, 1.1, 1.1], props: {},
      elems: function (c, T) { return c.st.blown ? [] : [{ k: 'R', a: T[0], b: T[1], r: R_ON, key: 'main' }]; } }
  };

  function terminals(c) {
    var def = TYPES[c.type];
    return def.term.map(function (p) { var q = rotp(p, c.rot || 0); return [c.x + q[0], c.y + q[1]]; });
  }
  function pk(p) { return p[0] + ',' + p[1]; }

  /* Wire path: L-vorm. bend 'h' = eerst horizontaal. Geeft lijst punten. */
  function wirePath(w) {
    var a = w.a, b = w.b;
    if (a[0] === b[0] || a[1] === b[1]) return [a, b];
    var m = w.bend === 'v' ? [a[0], b[1]] : [b[0], a[1]];
    return [a, m, b];
  }

  function numberContacts(circ) {
    var cnt = {};
    circ.comps.forEach(function (c) {
      if (c.type !== 'kno' && c.type !== 'knc') return;
      var n = cnt[c.props.of] = (cnt[c.props.of] || 0) + 1;
      c.num = c.type === 'kno' ? [n + '3', n + '4'] : [n + '1', n + '2'];
    });
  }

  function build(circ) {
    var nodeOf = new Map(), n = 1;
    function node(p) { var k = pk(p); if (!nodeOf.has(k)) nodeOf.set(k, n++); return nodeOf.get(k); }
    var coils = {};
    circ.comps.forEach(function (c) { if (c.type === 'coil') coils[c.label] = c; });
    var ctx = { relayOn: function (lbl) { var k = coils[lbl]; return !!(k && k.st.on); } };
    var elems = [];
    circ.comps.forEach(function (c) {
      var T = terminals(c).map(node);
      c._T = T;
      var es = TYPES[c.type].elems(c, T, function () { return n++; }, ctx) || [];
      es.forEach(function (e) { e.c = c; elems.push(e); });
    });
    circ.wires.forEach(function (w) {
      w._a = node(w.a); w._b = node(w.b);
      if (!w.burnt) elems.push({ k: 'R', a: w._a, b: w._b, r: R_WIRE, w: w });
    });
    return { n: n, elems: elems, nodeOf: nodeOf };
  }

  function gauss(A, b, N) {
    for (var col = 0; col < N; col++) {
      var piv = col, max = Math.abs(A[col][col]);
      for (var r = col + 1; r < N; r++) { var v = Math.abs(A[r][col]); if (v > max) { max = v; piv = r; } }
      if (max < 1e-30) continue;
      if (piv !== col) { var t = A[col]; A[col] = A[piv]; A[piv] = t; var tb = b[col]; b[col] = b[piv]; b[piv] = tb; }
      var rc = A[col], d = rc[col];
      for (r = col + 1; r < N; r++) {
        var row = A[r], f = row[col] / d;
        if (f === 0) continue;
        for (var k = col; k < N; k++) row[k] -= f * rc[k];
        b[r] -= f * b[col];
      }
    }
    var x = new Float64Array(N);
    for (var i = N - 1; i >= 0; i--) {
      var s = b[i];
      for (var j = i + 1; j < N; j++) s -= A[i][j] * x[j];
      x[i] = Math.abs(A[i][i]) < 1e-30 ? 0 : s / A[i][i];
    }
    return x;
  }

  /* Modified Nodal Analysis. Knoop 0 = referentie (aarde). */
  function solveMNA(n, elems) {
    var vs = elems.filter(function (e) { return e.k === 'V'; });
    var nn = n - 1, N = nn + vs.length;
    var A = [], b = new Float64Array(N);
    for (var i = 0; i < N; i++) A.push(new Float64Array(N));
    for (i = 0; i < nn; i++) A[i][i] += GMIN;
    function g(a, bb, gv) {
      if (a) A[a - 1][a - 1] += gv;
      if (bb) A[bb - 1][bb - 1] += gv;
      if (a && bb) { A[a - 1][bb - 1] -= gv; A[bb - 1][a - 1] -= gv; }
    }
    elems.forEach(function (e) {
      if (e.k === 'R') g(e.a, e.b, 1 / e.r);
      else if (e.k === 'I') { if (e.b) b[e.b - 1] += e.i; if (e.a) b[e.a - 1] -= e.i; }
    });
    vs.forEach(function (e, vi) {
      var j = nn + vi;
      if (e.a) { A[e.a - 1][j] += 1; A[j][e.a - 1] += 1; }
      if (e.b) { A[e.b - 1][j] -= 1; A[j][e.b - 1] -= 1; }
      b[j] = e.v;
    });
    var x = gauss(A, b, N);
    var V = new Float64Array(n);
    for (i = 1; i < n; i++) V[i] = x[i - 1];
    return V;
  }

  /* Volledige berekening inclusief LED-iteratie (stuksgewijs lineair). */
  function solveCircuit(circ) {
    numberContacts(circ);
    var leds = circ.comps.filter(function (c) { return c.type === 'led'; });
    var net, V, it = 0;
    for (; it < 30; it++) {
      net = build(circ);
      V = solveMNA(net.n, net.elems);
      var changed = false;
      leds.forEach(function (c) {
        if (c.st.broken) { c._on = false; return; }
        var vf = LED_KLEUR[c.props.kleur] || 2, vd = V[c._T[0]] - V[c._T[1]];
        if (c._on) { if ((vd - vf) / LED_RS < 0) { c._on = false; changed = true; } }
        else if (vd > vf + 1e-6) { c._on = true; changed = true; }
      });
      if (!changed) break;
    }
    // resultaten
    circ.comps.forEach(function (c) { c.I = 0; c.U = c._T.length >= 2 ? V[c._T[0]] - V[c._T[1]] : 0; c.res = {}; });
    net.elems.forEach(function (e) {
      if (e.k !== 'R') return;
      var i = (V[e.a] - V[e.b]) / e.r;
      if (e.w) { e.w.I = i; return; }
      if (e.key) e.c.res[e.key] = i;
    });
    circ.wires.forEach(function (w) { if (w.burnt) w.I = 0; w.Va = V[w._a]; w.Vb = V[w._b]; });
    circ.comps.forEach(function (c) {
      var r = c.res;
      if (c.type === 'led') {
        var vf = LED_KLEUR[c.props.kleur] || 2;
        c.I = c._on ? (c.U - vf) / LED_RS : (r.off || 0);
      } else if (c.type === 'dc' || c.type === 'ac') {
        c.I = r.ri || 0;
        if (c.type === 'ac') c.U = V[c._T[0]] - V[c._T[1]];
      } else if (c.type === 'rcd') {
        c.I = r.L || 0;
        c.leak = Math.abs((r.L || 0) + (r.N || 0));
      } else c.I = r.main || 0;
      c.P = Math.abs(c.U * c.I);
    });
    // AC-gebied (voor heen-en-weer bewegende stroompuntjes)
    var acNodes = new Set(), adj = {};
    net.elems.forEach(function (e) {
      if (e.k === 'I' || (e.k === 'R' && e.r > 1e5)) return;
      (adj[e.a] = adj[e.a] || []).push(e.b); (adj[e.b] = adj[e.b] || []).push(e.a);
    });
    var stack = [];
    circ.comps.forEach(function (c) { if (c.type === 'ac') c._T.forEach(function (t) { stack.push(t); }); });
    while (stack.length) {
      var q = stack.pop();
      if (q === 0 || acNodes.has(q)) continue;
      acNodes.add(q);
      (adj[q] || []).forEach(function (z) { stack.push(z); });
    }
    circ.wires.forEach(function (w) { w.ac = acNodes.has(w._a); });
    circ.comps.forEach(function (c) { c.ac = c._T.some(function (t) { return acNodes.has(t); }); });
    return { V: V, net: net, iter: it };
  }

  function heat(o, over, k, dt) {
    if (over > 1) o.heat = (o.heat || 0) + (over * over - 1) * k * dt;
    else o.heat = Math.max(0, (o.heat || 0) - dt * 0.5);
    return o.heat >= 1;
  }

  var MSG = {
    fuse: function (c) { return c.label + ' is doorgebrand. Te veel stroom.'; },
    am: function (c) { return 'Meterzekering van ' + c.label + ' is kapot (meer dan 10 A).'; },
    rcd: function (c) { return c.label + ' schakelt af: lekstroom ' + Math.round(c.leak * 1000) + ' mA naar aarde.'; },
    lamp: function (c) { return c.label + ' is kapot: spanning te hoog.'; },
    led: function (c) { return c.label + ' is kapot: te veel stroom. Gebruik een voorschakelweerstand.'; },
    res: function (c) { return c.label + ' is verbrand: te veel vermogen.'; },
    coil: function (c) { return 'Spoel ' + c.label + ' is verbrand: spanning te hoog.'; },
    buzz: function (c) { return c.label + ' is kapot: spanning te hoog.'; },
    motor: function (c) { return c.label + ' is kapot: spanning te hoog.'; }
  };

  /* Eén tijdstap. S = {dirty, res}. Geeft lijst gebeurtenissen. */
  function step(circ, dt, S) {
    var ev = [];
    if (S.dirty || !S.res) { S.res = solveCircuit(circ); S.dirty = false; }
    var comps = circ.comps, tripped = false;
    comps.forEach(function (c) {
      var st = c.st, I = Math.abs(c.I);
      if (c.type === 'fuse' && !st.blown && heat(st, I / c.props.In, 1, dt)) { st.blown = true; tripped = true; ev.push({ t: 'pop', c: c, msg: MSG.fuse(c) }); }
      if (c.type === 'am' && !st.blown && heat(st, I / 10, 1, dt)) { st.blown = true; tripped = true; ev.push({ t: 'pop', c: c, msg: MSG.am(c) }); }
      if (c.type === 'rcd' && !st.trip) {
        if (c.leak >= c.props.mA / 1000) { st.lt = (st.lt || 0) + dt; if (st.lt >= 0.02) { st.trip = true; st.lt = 0; tripped = true; ev.push({ t: 'trip', c: c, msg: MSG.rcd(c) }); } }
        else st.lt = 0;
      }
    });
    if (tripped) { S.dirty = true; return ev; }
    var broke = false;
    comps.forEach(function (c) {
      var st = c.st, p = c.props, over = 0, k = 1;
      if (st.broken) return;
      switch (c.type) {
        case 'lamp': over = Math.abs(c.U) / (1.25 * p.Vn); k = 2; break;
        case 'led': over = Math.abs(c.I) / 0.03; k = 3; break;
        case 'res': over = c.P / (1.5 * p.Pmax); k = 0.5; break;
        case 'coil': over = Math.abs(c.U) / (1.3 * p.Uc); k = 2; break;
        case 'buzz': case 'motor': over = Math.abs(c.U) / (1.3 * p.Vn); k = 2; break;
        default: return;
      }
      if (heat(st, over, k, dt)) { st.broken = true; broke = true; ev.push({ t: 'pop', c: c, msg: MSG[c.type](c) }); }
    });
    var maxI = 0, maxW = null;
    circ.wires.forEach(function (w) {
      if (w.burnt) return;
      var I = Math.abs(w.I || 0);
      if (I > maxI) { maxI = I; maxW = w; }
      if (heat(w, I / 16, 0.3, dt)) { w.burnt = true; broke = true; ev.push({ t: 'pop', w: w, msg: 'Kortsluiting! Een draad is doorgebrand. Gebruik een zekering.' }); }
    });
    if (maxI > 100) ev.push({ t: 'short', w: maxW, I: maxI });
    if (broke) S.dirty = true;
    // relais met kleine vertraging
    comps.forEach(function (c) {
      if (c.type === 'coil') {
        var U = Math.abs(c.U), want = !c.st.broken && (c.st.on ? U >= 0.4 * c.props.Uc : U >= 0.75 * c.props.Uc);
        if (want !== !!c.st.on) {
          c.st.t = (c.st.t || 0) + dt;
          if (c.st.t >= (want ? 0.06 : 0.04)) { c.st.on = want; c.st.t = 0; S.dirty = true; ev.push({ t: 'relay', c: c, on: want }); }
        } else c.st.t = 0;
      }
      if (c.type === 'buzz') c.active = !c.st.broken && Math.abs(c.U) >= 0.5 * c.props.Vn;
      if (c.type === 'motor') c.speed = c.st.broken ? 0 : Math.min(1.5, Math.abs(c.U) / c.props.Vn) * (c.U < 0 ? -1 : 1);
      if (c.type === 'lamp') c.bright = c.st.broken ? 0 : Math.min(1.4, c.P / c.props.P);
      if (c.type === 'led') c.bright = c.st.broken ? 0 : Math.min(1.3, Math.max(0, c.I) / 0.02);
    });
    return ev;
  }

  /* ---------- schakelingen opbouwen / opslaan ---------- */
  function mk(type, x, y, rot, label, props, st) {
    var p = {}, d = TYPES[type].props, k;
    for (k in d) p[k] = d[k];
    if (props) for (k in props) p[k] = props[k];
    return { type: type, x: x, y: y, rot: rot || 0, label: label, props: p, st: st || {} };
  }
  function W(ax, ay, bx, by, bend) { return { a: [ax, ay], b: [bx, by], bend: bend || 'h' }; }

  var KEEP_ST = ['blown', 'broken', 'trip'];
  function serialize(circ) {
    return {
      v: 1, naam: circ.naam || '',
      comps: circ.comps.map(function (c) {
        var st = {};
        KEEP_ST.forEach(function (k) { if (c.st[k]) st[k] = true; });
        return { type: c.type, x: c.x, y: c.y, rot: c.rot, label: c.label, props: JSON.parse(JSON.stringify(c.props)), st: st };
      }),
      wires: circ.wires.map(function (w) { var o = { a: w.a.slice(), b: w.b.slice(), bend: w.bend }; if (w.burnt) o.burnt = true; return o; })
    };
  }
  function deserialize(o) {
    if (!o || !Array.isArray(o.comps) || !Array.isArray(o.wires)) throw new Error('Geen geldige schakeling');
    var comps = o.comps.filter(function (c) { return TYPES[c.type]; }).map(function (c) {
      return mk(c.type, Math.round(+c.x), Math.round(+c.y), (c.rot | 0) & 3, String(c.label || TYPES[c.type].letter + '?'), c.props, c.st || {});
    });
    var wires = o.wires.map(function (w) {
      var r = W(Math.round(+w.a[0]), Math.round(+w.a[1]), Math.round(+w.b[0]), Math.round(+w.b[1]), w.bend === 'v' ? 'v' : 'h');
      if (w.burnt) r.burnt = true;
      return r;
    }).filter(function (w) { return !(w.a[0] === w.b[0] && w.a[1] === w.b[1]); });
    return { naam: o.naam || '', comps: comps, wires: wires };
  }

  var EXAMPLES = [

      var n = inp.value.trim() || 'Schakeling ' + new Date().toLocaleDateString('nl-NL');
      circ.naam = n; var list = getSaved().filter(function (x) { return x.naam !== n; });
      list.unshift({ naam: n, t: Date.now(), data: C.serialize(circ) });
      if (lsSet('schakelbord.saved', list)) { toast('Opgeslagen als "' + n + '".'); sheetSave(); } else toast('Opslaan lukt niet in deze browser. Gebruik Exporteer.', true);
    }));
    s.appendChild(r);
    var list = getSaved(), auto = lsGet('schakelbord.auto', null), box = el('div', 'saved');
    if (auto && auto.data) list = list.concat([auto]);
    if (!list.length) box.appendChild(el('p', 'muted', 'Nog niets opgeslagen.'));
    list.forEach(function (it) {
      var row = el('div', 'it'), d = el('div'); d.textContent = it.naam; var sm = el('small'); sm.textContent = new Date(it.t).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }); d.appendChild(sm);
      row.appendChild(d);
      row.appendChild(btn('Laden', '', function () { try { pushUndo(); setCirc(C.deserialize(it.data), true); closeSheet(); toast('"' + it.naam + '" geladen.'); } catch (e) { toast('Laden mislukt.', true); } }));
      if (it !== auto) {
        var del = btn('Wis', 'bad', function () {
          if (del.dataset.sure) { lsSet('schakelbord.saved', getSaved().filter(function (x) { return x.naam !== it.naam; })); sheetSave(); }
          else { del.dataset.sure = '1'; del.textContent = 'Zeker?'; }
        });
        row.appendChild(del);
      }
      box.appendChild(row);
    });
    s.appendChild(box);
    s.appendChild(el('h3', null, 'Delen als tekst'));
    var ta = el('textarea'); ta.id = 'io-text'; ta.placeholder = 'Plak hier een schakeling als tekst.'; ta.spellcheck = false;
    var r2 = el('div', 'row2');
    r2.appendChild(btn('Exporteer', '', function () { ta.value = JSON.stringify(C.serialize(circ)); ta.select(); }));
    r2.appendChild(btn('Kopieer', '', function () {
      if (!ta.value) ta.value = JSON.stringify(C.serialize(circ));
      var done = function () { toast('Gekopieerd.'); };
      try { navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); toast('Tekst is geselecteerd. Kopieer hem zelf.'); }); } catch (e) { ta.select(); }
    }));
    r2.appendChild(btn('Importeer', 'pri', function () {
      try { var c = C.deserialize(JSON.parse(ta.value)); pushUndo(); setCirc(c, true); closeSheet(); toast('Schakeling geladen.'); }
      catch (e) { toast('Deze tekst is geen schakeling. Kopieer de hele tekst opnieuw.', true); }
    }));
    s.appendChild(ta); s.appendChild(r2);
    s.appendChild(el('h3', null, 'Opnieuw beginnen'));
    var nb = btn('Leeg bord', 'bad', function () {
      if (nb.dataset.sure) { pushUndo(); setCirc({ naam: '', comps: [], wires: [] }, false); closeSheet(); toastUndo('Bord is leeg.'); }
      else { nb.dataset.sure = '1'; nb.textContent = 'Zeker? Tik nog een keer'; }
    });
    s.appendChild(nb);
  });
}

/* ---------- hoofdlus ---------- */
var last = performance.now(), frame = 0, cardT = 0;
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now; simT += dt; frame++;
  if (frame % 30 === 1) readTheme();
  var n = Math.max(1, Math.round(dt / (1 / 60))), h = dt / n, buzz = false, motor = 0;
  for (var i = 0; i < n; i++) {
    var ev = C.step(circ, h, S);
    ev.forEach(handleEv);
  }
  circ.comps.forEach(function (c) {
    if (c.type === 'buzz' && c.active) buzz = true;
    if (c.type === 'motor') { motor = Math.max(motor, Math.abs(c.speed || 0)); c.ang = (c.ang || 0) + (c.speed || 0) * dt * 10; }
  });
  updHum(buzz, motor);
  render(dt);
  if (mode === 'meten') updMeter();
  cardT += dt; if (cardT > 0.2 && !$('card').hidden) { cardT = 0; updVals(); }
  requestAnimationFrame(loop);
}
function handleEv(e) {
  if (e.t === 'relay') { snd(e.on ? 'relay' : 'relayoff'); }
  else if (e.t === 'pop') { snd('pop'); toast(e.msg, true); if (e.w) e.w.flash = simT + 1.5; if (sel && (sel.o === e.c || sel.o === e.w)) fillCard(); }
  else if (e.t === 'trip') { snd('trip'); toast(e.msg, true); if (sel && sel.o === e.c) fillCard(); }
  else if (e.t === 'short') {
    if (e.w) e.w.flash = simT + 1.2;
    if (simT - lastShort > 3) { lastShort = simT; toast('Kortsluiting! Heel grote stroom: ' + fI(e.I) + '.', true); }
  }
}

/* ---------- start ---------- */
document.querySelectorAll('.modes button').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
$('b-undo').addEventListener('click', doUndo); $('b-undo').disabled = true;
$('b-ex').addEventListener('click', sheetExamples);
$('b-save').addEventListener('click', sheetSave);
$('b-snd').addEventListener('click', function () { setSound(!soundOn); toast(soundOn ? 'Geluid aan.' : 'Geluid uit.'); });
$('hint-x').addEventListener('click', function () { $('hint').hidden = true; });
$('z-in').addEventListener('click', function () { zoomAt(1.25, W / 2, H / 2); });
$('z-out').addEventListener('click', function () { zoomAt(0.8, W / 2, H / 2); });
$('z-fit').addEventListener('click', fitView);
$('meter-clr').addEventListener('click', function () { probes = { a: null, b: null }; });
document.addEventListener('keydown', function (e) {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'Escape') { if (!$('sheet').hidden) closeSheet(); else select(null); }
  if (sel && sel.k === 'c' && (e.key === 'r' || e.key === 'R')) rotate(sel.o);
  if (sel && (e.key === 'Delete' || e.key === 'Backspace')) { if (sel.k === 'c') removeComp(sel.o); else removeWire(sel.o); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
});
new ResizeObserver(resize).observe(stage);
buildPalette(); readTheme(); setSound(soundOn);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { col._k = ''; readTheme(); });
loadExample(C.EXAMPLES[0]);
requestAnimationFrame(function (t) { last = t; loop(t); });
})();
</script>


<div id="idee" hidden style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center">
  <div style="background:var(--panel);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px;display:grid;gap:10px;max-height:80vh;overflow:auto">
    <h2 style="margin:0">Onderdeel bedenken</h2>
    <p style="margin:0;color:var(--muted)">Mis je een onderdeel? Schrijf het op. Het komt op je lijstje en bouwen we later samen.</p>
    <textarea id="idee-tekst" rows="2" maxlength="200" placeholder="Bijvoorbeeld: bewegingsmelder" style="font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"></textarea>
    <div style="display:flex;gap:8px"><button class="btn pri" id="idee-bewaar">Bewaar idee</button><button class="btn" id="idee-dicht">Sluiten</button></div>
    <b>Suggesties</b>
    <div id="idee-sug" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <b>Jouw ideeën</b>
    <ul id="idee-lijst" style="margin:0;padding-left:20px"></ul>
  </div>
</div>
<script>
(function () {
  var KEY = 'schakelbord.ideeen';
  var SUG = ['Transformator', 'Driefasen-net (400 V)', 'Condensator', 'Diode', 'Thermisch relais', 'Tijdrelais', 'Bewegingsmelder', 'Thermostaat', 'Wisselschakelaar (hotel)', 'Kruisschakelaar', 'Stopcontact', 'Dimmer', 'Installatieautomaat'];
  function lees() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function schrijf(l) { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} }
  var bak = document.getElementById('idee');
  function toon() {
    var l = lees(), ul = document.getElementById('idee-lijst'); ul.innerHTML = '';
    if (!l.length) { var li = document.createElement('li'); li.textContent = 'Nog geen ideeën.'; ul.appendChild(li); }
    l.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    var sg = document.getElementById('idee-sug'); sg.innerHTML = '';
    SUG.filter(function (t) { return l.indexOf(t) < 0; }).forEach(function (t) {
      var b = document.createElement('button'); b.className = 'btn'; b.textContent = '+ ' + t;
      b.addEventListener('click', function () { var m = lees(); m.push(t); schrijf(m); toon(); });
      sg.appendChild(b);
    });
  }
  document.getElementById('b-idee').addEventListener('click', function () { toon(); bak.hidden = false; });
  document.getElementById('idee-dicht').addEventListener('click', function () { bak.hidden = true; });
  bak.addEventListener('click', function (e) { if (e.target === bak) bak.hidden = true; });
  document.getElementById('idee-bewaar').addEventListener('click', function () {
    var ta = document.getElementById('idee-tekst'), t = ta.value.trim(); if (!t) return;
    var m = lees(); m.push(t.slice(0, 200)); schrijf(m); ta.value = ''; toon();
  });
})();
</script>
</body></html>
