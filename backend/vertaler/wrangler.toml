# Cloudflare Worker voor Vertalen (zie README, "Vertalen via Claude").
# Geheimen staan NIET hier, maar bij Cloudflare:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_CODE
name = "bash-bord-vertaler"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Teller voor de daglimiet. Geen id nodig: wrangler maakt hem zelf aan bij de eerste deploy.
[[kv_namespaces]]
binding = "TELLER"
