<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mail-hulp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#4A3A30}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1250px; box-sizing: border-box; background: linear-gradient(180deg, #F4B29C 0px, #F8CDB9 380px, #FBE6D9 850px, #FDF6EF 1250px); position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #4A3A30;">
<div style="padding: 24px 18px 120px; display: flex; flex-direction: column; gap: 14px;">

<!-- Bovenbalk -->
<div style="display: flex; align-items: center; gap: 12px;">
<button aria-label="Terug" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); background: #FBF3EA; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.9), 0 6px 14px rgba(170,110,80,0.22);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7A4A38" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="flex-grow: 1;">
<div style="font-size: 28px; font-weight: 900; color: #5A3426; line-height: 1.1;">Mail-hulp</div>
<div style="font-size: 14px; font-weight: 700; color: #7A4A38;">ik schrijf, jij verstuurt zelf</div>
</div>
<button onClick="{{restart}}" aria-label="Opnieuw beginnen" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: linear-gradient(160deg, #D2BDF0, #A88AD8); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 14px rgba(168,138,216,0.35); font-size: 22px;">↺</button>
</div>

<!-- Vraag 1 -->
<div style="align-self: flex-start; max-width: 85%; padding: 14px 16px; border-radius: 24px 24px 24px 6px; background: #FBF3EA; font-size: 17px; font-weight: 800; color: #4A3A30; box-shadow: 0 6px 14px rgba(170,110,80,0.15);">Hoi! ✉️ Waar gaat je mail over?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 12px; border-radius: 20px; border: 3px solid {{t.ring}}; background: #FFFFFF; font-size: 15px; font-weight: 800; color: #4A3A30; text-align: left; box-shadow: 0 5px 10px rgba(170,110,80,0.15);"><span style="font-size: 24px;" aria-hidden="true">{{t.emo}}</span>{{t.label}}</button>
</sc-for>
</div>

<!-- Vraag 2 -->
<sc-if value="{{step2}}" hint-placeholder-val="{{true}}">
<div style="align-self: flex-end; max-width: 80%; padding: 12px 16px; border-radius: 24px 24px 6px 24px; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 16px; font-weight: 800;">{{topicLabel}}</div>
<div style="align-self: flex-start; max-width: 85%; padding: 14px 16px; border-radius: 24px 24px 24px 6px; background: #FBF3EA; font-size: 17px; font-weight: 800; box-shadow: 0 6px 14px rgba(170,110,80,0.15);">Hoe moet het klinken?</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{tones}}" as="t" hint-placeholder-count="2">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 70px; border-radius: 20px; border: 3px solid {{t.ring}}; background: #FFFFFF; font-size: 15px; font-weight: 800; color: #4A3A30; box-shadow: 0 5px 10px rgba(170,110,80,0.15);"><span style="font-size: 26px;" aria-hidden="true">{{t.emo}}</span>{{t.label}}</button>
</sc-for>
</div>
</sc-if>

<!-- Concept -->
<sc-if value="{{step3}}" hint-placeholder-val="{{true}}">
<div style="align-self: flex-start; max-width: 85%; padding: 14px 16px; border-radius: 24px 24px 24px 6px; background: #FBF3EA; font-size: 17px; font-weight: 800; box-shadow: 0 6px 14px rgba(170,110,80,0.15);">Hier is je mail! 👇</div>
<section aria-label="Concept mail" style="background: #FFFFFF; border-radius: 26px; padding: 16px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.9), 0 10px 22px rgba(170,110,80,0.2); display: flex; flex-direction: column; gap: 8px; border: 2px solid #EFE3F7;">
<div style="font-size: 14px; font-weight: 800; color: #8A6A5A;">Onderwerp</div>
<div style="font-size: 17px; font-weight: 900; color: #3E2F66;">{{subject}}</div>
<div style="height: 1px; background: #EFE3F7;"></div>
<div style="font-size: 16px; font-weight: 600; line-height: 1.45; white-space: pre-line; color: #4A3A30;">{{body}}</div>
</section>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<button style="min-height: 52px; border-radius: 18px; border: none; background: linear-gradient(160deg, #A8D6B4, #6FAE84); color: #FFFFFF; font-size: 16px; font-weight: 900; box-shadow: 0 6px 12px rgba(111,174,132,0.35);">📋 Kopiëren</button>
<button style="min-height: 52px; border-radius: 18px; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 16px; font-weight: 900; box-shadow: 0 6px 12px rgba(217,105,79,0.35);">🔊 Voorlezen</button>
<button style="min-height: 52px; border-radius: 18px; border: none; background: #FFFFFF; font-size: 16px; font-weight: 900; color: #4A3A30; box-shadow: 0 5px 10px rgba(170,110,80,0.15);">✂️ Korter</button>
<button style="min-height: 52px; border-radius: 18px; border: none; background: #FFFFFF; font-size: 16px; font-weight: 900; color: #4A3A30; box-shadow: 0 5px 10px rgba(170,110,80,0.15);">📨 In Gmail zetten</button>
</div>
<div style="font-size: 14px; font-weight: 700; color: #8A5A48; text-align: center;">Ik verstuur nooit zelf. Jij kijkt en drukt op versturen.</div>
</sc-if>

</div>

<!-- Typbalk onderaan -->
<div style="position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 18px; border-radius: 999px; background: #FBF3EA; box-shadow: 0 10px 24px rgba(170,110,80,0.28);">
<span style="flex-grow: 1; font-size: 16px; font-weight: 700; color: #9A7A6A;">Of typ zelf wat je wilt zeggen...</span>
<button aria-label="Inspreken" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; font-size: 22px; box-shadow: 0 3px 8px rgba(170,110,80,0.2);">🎤</button>
<button aria-label="Versturen naar mail-hulp" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 20px; font-weight: 900;">↑</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { topic: 'ziek', tone: 'officieel' };
}
renderVals() {
var self = this;
var s = this.state;
var T = [
{ id: 'ziek', emo: '🤒', label: 'Ziek melden' },
{ id: 'leraar', emo: '🎒', label: 'Vraag aan leraar' },
{ id: 'uren', emo: '⏰', label: 'Uren naar Kim' },
{ id: 'anders', emo: '💬', label: 'Iets anders' }
];
var topics = T.map(function (t) { var on = s.topic === t.id; return Object.assign({}, t, { on: on ? 'true' : 'false', ring: on ? '#D9694F' : 'transparent', pick: function () { self.setState({ topic: t.id, tone: null }); } }); });
var tones = [{ id: 'officieel', emo: '👔', label: 'Officieel' }, { id: 'gewoon', emo: '😊', label: 'Gewoon' }].map(function (t) { var on = s.tone === t.id; return Object.assign({}, t, { on: on ? 'true' : 'false', ring: on ? '#D9694F' : 'transparent', pick: function () { self.setState({ tone: t.id }); } }); });
var M = {
ziek: { subject: 'Ziekmelding', officieel: 'Beste meneer/mevrouw,\n\nHierbij meld ik mij vandaag ziek. Ik laat het weten zodra ik weer beter ben.\n\nMet vriendelijke groet,\nOdelia van der Most', gewoon: 'Hoi,\n\nIk ben vandaag helaas ziek. Ik laat weten wanneer ik weer beter ben.\n\nGroetjes,\nOdelia' },
leraar: { subject: 'Vraag over de opdracht', officieel: 'Beste meneer Jansen,\n\nIk heb een vraag over de opdracht. Kunt u mij uitleggen wat er precies bedoeld wordt?\n\nAlvast bedankt.\n\nMet vriendelijke groet,\nOdelia van der Most', gewoon: 'Hoi meneer Jansen,\n\nIk snap de opdracht nog niet helemaal. Kunt u het nog een keer uitleggen?\n\nDank u wel!\nOdelia' },
uren: { subject: 'Re: Urenregistratie', officieel: 'Hoi Kim,\n\nHier de uren van afgelopen week.\n\nMet hartelijke groet,\nOdelia van der Most', gewoon: 'Hoi Kim,\n\nHier de uren van afgelopen week.\n\nMet hartelijke groet,\nOdelia van der Most' },
anders: { subject: '...', officieel: 'Vertel me in het typveld of met 🎤 waar je mail over gaat. Dan schrijf ik hem voor je.', gewoon: 'Vertel me in het typveld of met 🎤 waar je mail over gaat. Dan schrijf ik hem voor je.' }
};
var m = M[s.topic];
var label = T.filter(function (t) { return t.id === s.topic; })[0];
return {
topics: topics,
tones: tones,
step2: !!s.topic,
step3: !!s.topic && !!s.tone,
topicLabel: label ? label.emo + ' ' + label.label : '',
subject: m ? m.subject : '',
body: m && s.tone ? m[s.tone] : '',
restart: function () { self.setState({ topic: null, tone: null }); }
};
}
}
</script>
</body>
</html>
