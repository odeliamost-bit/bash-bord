<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Recepten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#4A3A30}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1750px; box-sizing: border-box; background: linear-gradient(180deg, #F4B29C 0px, #F8CDB9 380px, #FBE6D9 850px, #FDF6EF 1750px); position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #4A3A30;">
<div style="padding: 24px 18px 40px; display: flex; flex-direction: column; gap: 16px; width: 390px; height: 1542px">

<!-- Bovenbalk -->
<div style="display: flex; align-items: center; gap: 12px;">
<button aria-label="Terug" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); background: #FBF3EA; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.9), 0 6px 14px rgba(170,110,80,0.22);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7A4A38" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="flex-grow: 1; font-size: 28px; font-weight: 900; color: #5A3426;">Recepten</div>
<span style="width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(160deg, #F7DA8A, #E5B54E); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 14px rgba(229,181,78,0.35);">🍳</span>
</div>

<!-- Zoeken -->
<div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 8px 0 16px; border-radius: 999px; background: #FBF3EA; box-shadow: inset 0 2px 4px rgba(170,110,80,0.12), 0 6px 14px rgba(170,110,80,0.15);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A7A6A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="flex-grow: 1; font-size: 16px; font-weight: 700; color: #9A7A6A;">Zoek: pasta, kip, snel...</span>
<button aria-label="Zoeken met je stem" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); font-size: 20px;">🎤</button>
</div>

<!-- Toevoegen -->
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
<button style="min-height: 54px; border-radius: 20px; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 16px; font-weight: 900; box-shadow: 0 6px 12px rgba(217,105,79,0.35);">+ Recept</button>
<button style="min-height: 54px; border-radius: 20px; border: none; background: #FBF3EA; font-size: 16px; font-weight: 900; color: #4A3A30; box-shadow: 0 5px 10px rgba(170,110,80,0.18);">📋 Link plakken</button>
</div>

<!-- Soorten -->
<div role="tablist" aria-label="Soort" style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button role="tab" onClick="{{f.pick}}" aria-selected="{{f.on}}" style="min-height: 44px; padding: 0 14px; border: none; border-radius: 999px; background: {{f.bg}}; color: {{f.ink}}; font-size: 15px; font-weight: 900; box-shadow: {{f.shadow}};">{{f.label}}</button>
</sc-for>
</div>

<!-- Kaartjes -->
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{cards}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.open}}" aria-pressed="{{r.on}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 26px; border: 3px solid {{r.ring}}; background: {{r.bg}}; text-align: left; color: #4A3A30; box-shadow: inset 0 3px 0 rgba(255,255,255,0.7), 0 10px 20px rgba(170,110,80,0.16);">
<div style="display: flex; justify-content: space-between; width: 100%;">
<span style="width: 58px; height: 58px; border-radius: 18px; background: rgba(255,255,255,0.75); display: flex; align-items: center; justify-content: center; font-size: 32px;" aria-hidden="true">{{r.emo}}</span>
<span style="font-size: 13px; font-weight: 900; color: {{r.tagInk}}; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 4px 8px; height: fit-content;">{{r.tag}}</span>
</div>
<span style="font-size: 16px; font-weight: 900; color: #5A3426; line-height: 1.15;">{{r.name}}</span>
<span style="font-size: 13px; font-weight: 800; color: #8A6A5A;">⏱ {{r.time}}</span>
</button>
</sc-for>
</div>

<!-- Recept open -->
<section aria-label="{{cur.name}}" style="background: #FFFFFF; border-radius: 30px; padding: 18px; border: 3px solid #F7DA8A; box-shadow: 0 12px 24px rgba(170,110,80,0.2); display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="width: 64px; height: 64px; border-radius: 20px; background: {{cur.bg}}; display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0;" aria-hidden="true">{{cur.emo}}</span>
<div style="flex-grow: 1;">
<div style="font-size: 21px; font-weight: 900; color: #5A3426; line-height: 1.1;">{{cur.name}}</div>
<div style="font-size: 14px; font-weight: 800; color: #8A6A5A;">⏱ {{cur.time}} · {{cur.people}}</div>
</div>
<button aria-label="Voorlezen" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); font-size: 20px;">🔊</button>
</div>
<div style="font-size: 17px; font-weight: 900; color: #5A3426;">🧺 Wat heb je nodig?</div>
<sc-for list="{{ingr}}" as="i" hint-placeholder-count="4">
<button onClick="{{i.toggle}}" aria-pressed="{{i.on}}" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; border: none; background: #FBF3EA; text-align: left; font-size: 16px; font-weight: 800; color: #4A3A30;">
<span style="width: 26px; height: 26px; border-radius: 8px; border: 3px solid {{i.ring}}; background: {{i.bg}}; color: #FFFFFF; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{i.mark}}</span>{{i.label}}
</button>
</sc-for>
<button style="min-height: 48px; border-radius: 999px; border: 2px dashed #6FAE84; background: transparent; color: #3F7A58; font-size: 15px; font-weight: 900;">🛒 Wat ik mis op mijn boodschappenlijst</button>
<div style="font-size: 17px; font-weight: 900; color: #5A3426;">👩‍🍳 Stap {{stepNr}} van {{stepTotal}}</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: #FBEBC4;">
<span style="font-size: 34px;" aria-hidden="true">{{step.emo}}</span>
<span style="font-size: 18px; font-weight: 900; line-height: 1.25;">{{step.text}}</span>
</div>
<div style="display: grid; grid-template-columns: 56px 1fr; gap: 8px;">
<button onClick="{{prev}}" aria-label="Vorige stap" style="min-height: 54px; border-radius: 18px; border: none; background: #FBF3EA; font-size: 22px; font-weight: 900; color: #7A4A38; opacity: {{prevOp}};">‹</button>
<button onClick="{{next}}" style="min-height: 54px; border-radius: 18px; border: none; background: linear-gradient(160deg, #A8D6B4, #6FAE84); color: #FFFFFF; font-size: 18px; font-weight: 900;">{{nextLabel}}</button>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1750}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { filter: 'alles', sel: 'pesto', step: 0, have: {} };
}
renderVals() {
var self = this;
var s = this.state;
var G = { avond: { label: '🍝 Avondeten', bg: '#FDE6DA' }, lunch: { label: '🥪 Lunch', bg: '#E3EDDF' }, bakken: { label: '🍰 Bakken', bg: '#FBE0E8' }, idee: { label: '💡 Ideeën', bg: '#EFE7FB' } };
var R = [
{ id: 'pesto', group: 'avond', emo: '🍝', name: 'Pasta pesto', time: '15 min', people: '2 pers.', ingr: ['pasta', 'pesto', 'cherrytomaatjes', 'kaas'], steps: [['💧', 'Kook water in een grote pan.'], ['🍝', 'Doe de pasta erin. 10 minuten koken.'], ['🍅', 'Snij de tomaatjes doormidden.'], ['🥄', 'Giet de pasta af en roer de pesto erdoor.'], ['🧀', 'Tomaatjes en kaas erop. Eet smakelijk!']] },
{ id: 'pannenkoek', group: 'avond', emo: '🥞', name: 'Pannenkoeken', time: '30 min', people: '2 pers.', ingr: ['bloem', 'melk', 'eieren', 'boter'], steps: [['🥣', 'Doe bloem, melk en eieren in een kom.'], ['🌀', 'Klop tot er geen klontjes meer zijn.'], ['🍳', 'Smelt boter in de pan, schep beslag erin.'], ['🔄', 'Omdraaien als de bovenkant droog is.']] },
{ id: 'tosti', group: 'lunch', emo: '🥪', name: 'Tosti', time: '5 min', people: '1 pers.', ingr: ['brood', 'kaas', 'ham'], steps: [['🍞', 'Leg kaas en ham tussen 2 boterhammen.'], ['🔥', 'In het tosti-ijzer, 4 minuten.']] },
{ id: 'oats', group: 'lunch', emo: '🥣', name: 'Overnight oats', time: '5 min', people: '1 pers.', ingr: ['havermout', 'yoghurt', 'fruit'], steps: [['🥣', 'Havermout en yoghurt in een potje.'], ['🍓', 'Fruit erop, deksel dicht.'], ['🌙', 'Een nacht in de koelkast. Klaar!']] },
{ id: 'banaan', group: 'bakken', emo: '🍌', name: 'Bananenbrood', time: '1 uur', people: '1 cake', ingr: ['3 bananen', 'bloem', 'eieren', 'suiker', 'bakpoeder'], steps: [['🍌', 'Prak de bananen fijn.'], ['🥣', 'Meng alles in een kom.'], ['🍞', 'In een cakevorm doen.'], ['⏲️', '50 minuten in de oven op 180 graden.']] },
{ id: 'sushi', group: 'idee', emo: '🍣', name: 'Zelf sushi maken', time: 'nog proberen', people: 'idee', ingr: ['sushirijst', 'nori', 'komkommer'], steps: [['💡', 'Idee: een recept zoeken en bewaren.']] }
];
var byId = {}; R.forEach(function (r) { byId[r.id] = r; });
var list = s.filter === 'alles' ? R : R.filter(function (r) { return r.group === s.filter; });
var cards = list.map(function (r) {
var on = s.sel === r.id;
var isIdee = r.group === 'idee';
return { emo: r.emo, name: r.name, time: r.time, bg: G[r.group].bg, tag: isIdee ? '💡 idee' : '✓ gemaakt', tagInk: isIdee ? '#6A4BC4' : '#3F7A58', on: on ? 'true' : 'false', ring: on ? '#D9694F' : 'transparent', open: function () { self.setState({ sel: r.id, step: 0, have: {} }); } };
});
var filters = [{ id: 'alles', label: 'Alles' }].concat(Object.keys(G).map(function (k) { return { id: k, label: G[k].label }; })).map(function (f) {
var on = s.filter === f.id;
return { label: f.label, on: on ? 'true' : 'false', bg: on ? 'linear-gradient(160deg, #F4A58B, #D9694F)' : 'rgba(251,243,234,0.85)', ink: on ? '#FFFFFF' : '#7A4A38', shadow: on ? 'inset 0 3px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(217,105,79,0.35)' : '0 3px 8px rgba(170,110,80,0.12)', pick: function () { self.setState({ filter: f.id }); } };
});
var cur = byId[s.sel];
var ingr = cur.ingr.map(function (x) { var on = !!s.have[x]; return { label: x, on: on ? 'true' : 'false', mark: on ? '✓' : '', ring: on ? '#6FAE84' : '#E3C3B0', bg: on ? '#6FAE84' : '#FFFFFF', toggle: function () { var h = Object.assign({}, s.have); h[x] = !h[x]; self.setState({ have: h }); } }; });
var n = cur.steps.length, last = s.step >= n - 1;
var st = cur.steps[Math.min(s.step, n - 1)];
return {
filters: filters,
cards: cards,
cur: { name: cur.name, emo: cur.emo, time: cur.time, people: cur.people, bg: G[cur.group].bg },
ingr: ingr,
step: { emo: st[0], text: st[1] },
stepNr: Math.min(s.step, n - 1) + 1,
stepTotal: n,
nextLabel: last ? '🎉 Klaar!' : 'Volgende stap ›',
prevOp: s.step === 0 ? '0.4' : '1',
next: function () { self.setState({ step: last ? 0 : s.step + 1 }); },
prev: function () { if (s.step > 0) self.setState({ step: s.step - 1 }); }
};
}
}
</script>
</body>
</html>
