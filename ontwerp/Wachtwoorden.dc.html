<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wachtwoorden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#4A3A30}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1150px; box-sizing: border-box; background: linear-gradient(180deg, #F4B29C 0px, #F8CDB9 380px, #FBE6D9 850px, #FDF6EF 1150px); position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #4A3A30;">
<div style="padding: 24px 18px 40px; display: flex; flex-direction: column; gap: 16px;">

<!-- Bovenbalk -->
<div style="display: flex; align-items: center; gap: 12px;">
<button aria-label="Terug" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.7); background: #FBF3EA; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.9), 0 6px 14px rgba(170,110,80,0.22);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7A4A38" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="flex-grow: 1; font-size: 28px; font-weight: 900; color: #5A3426;">Wachtwoorden</div>
<button onClick="{{lock}}" aria-label="Op slot doen" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: linear-gradient(160deg, #9AD1D4, #5FA8AD); font-size: 24px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 14px rgba(95,168,173,0.35);">{{lockIcon}}</button>
</div>

<!-- Op slot -->
<sc-if value="{{locked}}" hint-placeholder-val="{{true}}">
<section aria-label="Pincode" style="background: #FBF3EA; border-radius: 30px; padding: 26px 20px; border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 3px 0 rgba(255,255,255,0.9), 0 12px 24px rgba(170,110,80,0.2); display: flex; flex-direction: column; align-items: center; gap: 16px;">
<span style="width: 84px; height: 84px; border-radius: 28px; background: linear-gradient(160deg, #9AD1D4, #5FA8AD); display: flex; align-items: center; justify-content: center; font-size: 42px; box-shadow: inset 0 4px 0 rgba(255,255,255,0.45), 0 10px 20px rgba(95,168,173,0.35);" aria-hidden="true">🔒</span>
<div style="font-size: 21px; font-weight: 900; color: #5A3426;">Op slot</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 5px; width: 100%;">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="min-height: 46px; border: none; border-radius: 999px; background: {{m.bg}}; color: {{m.ink}}; font-size: 15px; font-weight: 900;">{{m.label}}</button>
</sc-for>
</div>
<sc-if value="{{modeVinger}}" hint-placeholder-val="{{true}}">
<button onClick="{{unlockNow}}" aria-label="Vingerafdruk" style="width: 130px; height: 130px; border-radius: 50%; border: none; background: radial-gradient(circle at 40% 35%, #C9ECEE, #5FA8AD); box-shadow: inset 0 5px 0 rgba(255,255,255,0.5), 0 0 0 10px rgba(95,168,173,0.18), 0 12px 24px rgba(95,168,173,0.4); display: flex; align-items: center; justify-content: center;">
<svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 4a7 7 0 0 0-7 7v2M19 11a7 7 0 0 0-3-5.7M12 7.5a3.5 3.5 0 0 0-3.5 3.5v3c0 2 .6 3.8 1.6 5.3M15.5 11v2.5c0 2.6-.8 5-2.2 7M12 11v3c0 2.6-.9 5-2.5 6.8M19 14c0 2.3-.6 4.5-1.6 6.3"></path></svg>
</button>
<div style="font-size: 16px; font-weight: 800; color: #8A6A5A;">Leg je vinger op de sensor</div>
</sc-if>
<sc-if value="{{modePatroon}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; padding: 10px; border-radius: 26px; background: #FFFFFF;">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="9">
<button onClick="{{d.press}}" aria-label="{{d.aria}}" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center;"><span style="width: {{d.size}}; height: {{d.size}}; border-radius: 50%; background: {{d.bg}}; box-shadow: {{d.glow}};"></span></button>
</sc-for>
</div>
<div style="font-size: 16px; font-weight: 800; color: #8A6A5A;">Teken je patroon (tik 4 bolletjes)</div>
</sc-if>
</section>
</sc-if>

<!-- Open -->
<sc-if value="{{unlocked}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px; border-radius: 999px; background: #FBF3EA; box-shadow: inset 0 2px 4px rgba(170,110,80,0.12), 0 6px 14px rgba(170,110,80,0.15);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A7A6A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="font-size: 16px; font-weight: 700; color: #9A7A6A;">Zoek een website of app...</span>
</div>
<div role="tablist" aria-label="Groep" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: rgba(251,243,234,0.7); border-radius: 999px; padding: 6px; box-shadow: inset 0 2px 4px rgba(170,110,80,0.12);">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<button role="tab" onClick="{{g.pick}}" aria-selected="{{g.on}}" style="min-height: 46px; border: none; border-radius: 999px; background: {{g.bg}}; color: {{g.ink}}; font-size: 15px; font-weight: 900; box-shadow: {{g.shadow}};">{{g.label}}</button>
</sc-for>
</div>
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
<div style="background: #FBF3EA; border-radius: 26px; padding: 14px; border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 3px 0 rgba(255,255,255,0.9), 0 8px 18px rgba(170,110,80,0.16); display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 12px;">
<span style="width: 48px; height: 48px; border-radius: 16px; background: {{a.color}}; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;" aria-hidden="true">{{a.emo}}</span>
<div style="flex-grow: 1; min-width: 0;">
<div style="font-size: 18px; font-weight: 900; color: #5A3426;">{{a.site}}</div>
<div style="font-size: 14px; font-weight: 700; color: #8A6A5A;">{{a.user}}</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<div style="flex-grow: 1; min-height: 46px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; font-size: 18px; font-weight: 900; letter-spacing: {{a.spacing}}; color: #4A3A30;">{{a.pw}}</div>
<button onClick="{{a.toggle}}" aria-label="{{a.eyeLabel}}" style="width: 46px; height: 46px; border-radius: 14px; border: none; background: #FFFFFF; font-size: 20px; box-shadow: 0 3px 8px rgba(170,110,80,0.15);">{{a.eye}}</button>
<button aria-label="Kopiëren" style="width: 46px; height: 46px; border-radius: 14px; border: none; background: linear-gradient(160deg, #9AD1D4, #5FA8AD); font-size: 20px;">📋</button>
</div>
</div>
</sc-for>
<button style="min-height: 58px; border-radius: 999px; border: none; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 18px; font-weight: 900; box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 6px 12px rgba(217,105,79,0.4);">+ Nieuw wachtwoord</button>
<div style="font-size: 13px; font-weight: 700; color: #8A6A5A; text-align: center;">Dit zijn voorbeelden, geen echte wachtwoorden.</div>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1150}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mode: 'vinger', path: [], open: !!props.startOpen, group: 'school', show: {} };
}
renderVals() {
var self = this;
var s = this.state;
var modes = [{ id: 'vinger', label: '👆 Vingerafdruk' }, { id: 'patroon', label: '⋯ Patroon' }].map(function (m) {
var on = s.mode === m.id;
return { label: m.label, on: on ? 'true' : 'false', bg: on ? 'linear-gradient(160deg, #9AD1D4, #5FA8AD)' : 'transparent', ink: on ? '#FFFFFF' : '#5A4D4A', pick: function () { self.setState({ mode: m.id, path: [] }); } };
});
var path = s.path || [];
var dots = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (i) {
var on = path.indexOf(i) >= 0;
return { aria: 'bolletje ' + (i + 1), size: on ? '34px' : '22px', bg: on ? '#5FA8AD' : '#D9E7E8', glow: on ? '0 0 0 8px rgba(95,168,173,0.25)' : 'none', press: function () { if (on) return; var n = path.concat([i]); if (n.length >= 4) { self.setState({ path: [], open: true }); } else { self.setState({ path: n }); } } };
});
var A = [
{ id: 'a1', group: 'school', emo: '🎒', site: 'Schoolportaal', user: 'voorbeeld@school.nl', pw: 'Voorbeeld123', color: '#FBE0E8' },
{ id: 'a2', group: 'school', emo: '📚', site: 'Leerplatform', user: 'leerling-voorbeeld', pw: 'Zonnebloem!7', color: '#EFE7FB' },
{ id: 'a3', group: 'werk', emo: '🏭', site: 'Uren-portaal', user: 'voorbeeld.naam', pw: 'Werk-2026', color: '#E3EDDF' },
{ id: 'a4', group: 'thuis', emo: '🎬', site: 'Streaming', user: 'voorbeeld@mail.nl', pw: 'Popcorn42', color: '#FBEBC4' },
{ id: 'a5', group: 'thuis', emo: '🛒', site: 'Webwinkel', user: 'voorbeeld@mail.nl', pw: 'Kassa*55', color: '#DCE7F2' }
];
var accounts = A.filter(function (a) { return a.group === s.group; }).map(function (a) {
var sh = !!s.show[a.id];
return { emo: a.emo, site: a.site, user: a.user, color: a.color, pw: sh ? a.pw : '••••••••', spacing: sh ? '0.5px' : '3px', eye: sh ? '🙈' : '👁️', eyeLabel: sh ? 'Verbergen' : 'Laten zien', toggle: function () { var x = Object.assign({}, s.show); x[a.id] = !x[a.id]; self.setState({ show: x }); } };
});
var groups = [{ id: 'school', label: '🎒 School' }, { id: 'werk', label: '🏭 Werk' }, { id: 'thuis', label: '🏠 Thuis' }].map(function (g) {
var on = s.group === g.id;
return { label: g.label, on: on ? 'true' : 'false', bg: on ? 'linear-gradient(160deg, #F4A58B, #D9694F)' : 'transparent', ink: on ? '#FFFFFF' : '#7A4A38', shadow: on ? 'inset 0 3px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(217,105,79,0.35)' : 'none', pick: function () { self.setState({ group: g.id }); } };
});
return {
locked: !s.open,
unlocked: s.open,
lockIcon: s.open ? '🔓' : '🔒',
lock: function () { self.setState({ open: false, path: [], show: {} }); },
modes: modes,
modeVinger: s.mode === 'vinger',
modePatroon: s.mode === 'patroon',
dots: dots,
unlockNow: function () { self.setState({ open: true }); },
groups: groups,
accounts: accounts
};
}
}
</script>
</body>
</html>
