<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Snel vastleggen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#3A3046}
a{color:#6A4BC4}a:hover{color:#4F3399}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; min-height: 1200px; box-sizing: border-box; background: linear-gradient(180deg, #F4B29C 0%, #F8CDB9 25%, #FBE6D9 60%, #FDF6EF 100%); padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; font-family: 'Nunito', system-ui, sans-serif; color: #3A3046;">

<div style="display: flex; align-items: center; gap: 12px;">
<a href="Main.dc.html" aria-label="Terug" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #EEE6F8;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4F3399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 28px; font-weight: 900; flex-grow: 1;">Onthoud dit</div>
<button onClick="{{listen}}" aria-label="Inspreken" style="width: 64px; height: 64px; border-radius: 50%; border: 5px solid #FFFFFF; background: linear-gradient(160deg, #F4A58B, #D9694F); display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #B9533C, 0 8px 18px rgba(217,105,79,0.3);">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>

<!-- Wie -->
<section aria-label="Wie" style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 900;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A4BC4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
Wie?
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
<sc-for list="{{people}}" as="p" hint-placeholder-count="5">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 3px solid {{p.ring}}; background: #FFFFFF; font-size: 16px; font-weight: 800; color: #3A3046;">
<span style="width: 38px; height: 38px; border-radius: 50%; background: {{p.color}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #3A3046;">{{p.ini}}</span>
{{p.name}}
</button>
</sc-for>
<button aria-label="Nieuwe persoon" style="width: 52px; height: 52px; border-radius: 50%; border: 3px dashed #B9A3F0; background: transparent; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6A4BC4" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
</section>

<!-- Wat -->
<section aria-label="Wat" style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 900;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2457A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>
Wat?
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<sc-for list="{{whats}}" as="w" hint-placeholder-count="6">
<button onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 20px; border: 3px solid {{w.ring}}; background: {{w.color}}; font-size: 15px; font-weight: 800; color: #3A3046; min-height: 84px;">
<span style="width: 40px; height: 40px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A3046" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg>
</span>
{{w.label}}
</button>
</sc-for>
</div>
</section>

<!-- Foto -->
<section aria-label="Foto" style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 900;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F7A58" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Foto erbij?
</div>
<sc-if value="{{noPhoto}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 20px; background: #D6EBDD; color: #24452F; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: inset 0 3px 0 rgba(255,255,255,0.6), 0 6px 14px rgba(80,130,95,0.18);">
<input type="file" accept="image/*" capture="environment" onChange="{{onPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3F7A58" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
Maak foto
</label>
<label style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 20px; background: #FFFFFF; color: #3A3046; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 2px 0 #EEE6F8;">
<input type="file" accept="image/*" onChange="{{onPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A4BC4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
Kies foto
</label>
</div>
</sc-if>
<sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 20px; padding: 8px; box-shadow: 0 2px 0 #EEE6F8;">
<img src="{{photo}}" alt="Je foto" style="width: 84px; height: 84px; border-radius: 14px; object-fit: cover; flex-shrink: 0;">
<span style="flex-grow: 1; font-size: 16px; font-weight: 800; color: #24452F;">Foto staat erbij</span>
<button onClick="{{removePhoto}}" aria-label="Foto weghalen" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FBD9D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B0413A" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
</sc-if>
</section>

<!-- Wanneer -->
<section aria-label="Wanneer" style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 900;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F6DB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
Wanneer klaar?
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{whens}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 68px; border-radius: 18px; border: 3px solid {{d.ring}}; background: #D4E8FF; color: #1F3F66;">
<span style="font-size: 15px; font-weight: 800;">{{d.top}}</span>
<span style="font-size: 22px; font-weight: 900; line-height: 1.1;">{{d.big}}</span>
</button>
</sc-for>
</div>
</section>

<!-- Notitie -->
<label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 6px 6px 6px 16px; box-shadow: 0 2px 0 #EEE6F8;">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Notitie</span>
<input type="text" value="{{note}}" onChange="{{onNote}}" placeholder="{{notePh}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; font-size: 17px; font-weight: 700; color: #3A3046; background: transparent; min-height: 44px;">
<button onClick="{{listen}}" aria-label="Notitie inspreken" style="border: none; width: 44px; height: 44px; border-radius: 14px; background: #E6DBFF; display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6A4BC4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</label>

<!-- Melding -->
<button onClick="{{toggleRemind}}" aria-pressed="{{remind}}" style="display: flex; align-items: center; gap: 12px; background: #FFF1C6; border: none; border-radius: 20px; padding: 12px 14px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.6), 0 8px 18px rgba(196,140,60,0.16); text-align: left; color: #4E3B08;">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A6F05" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
</span>
<span style="flex-grow: 1; font-size: 16px; font-weight: 800;">Seintje de dag ervoor</span>
<span style="width: 56px; height: 32px; border-radius: 999px; background: {{switchBg}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{switchSide}};">
<span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF;"></span>
</span>
</button>

<div style="flex-grow: 1;"></div>

<sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
<button onClick="{{save}}" style="border: none; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 24px; background: linear-gradient(160deg, #F4A58B, #D9694F); color: #FFFFFF; font-size: 21px; font-weight: 900; text-decoration: none; box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), 0 6px 0 #B9533C, 0 10px 22px rgba(217,105,79,0.3);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
Bewaren
</button>
</sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border-radius: 24px; background: #3F9A64; color: #FFFFFF; font-size: 21px; font-weight: 900; text-decoration: none; box-shadow: 0 6px 0 #2E7A4C;">Bewaard! Terug naar start</a>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { who: 'jansen', what: 'inleveren', when: 'ma', remind: true, photo: '', note: '', listening: false, saved: false };
}
renderVals() {
var s = this.state;
var self = this;
var on = '#D9694F', off = 'transparent';
var people = [
{ id: 'jansen', name: 'Dhr. Jansen', ini: 'J', color: '#FFD6E3' },
{ id: 'bakker', name: 'Mevr. Bakker', ini: 'B', color: '#E6DBFF' },
{ id: 'kim', name: 'Kim', ini: 'K', color: '#FFF1B8' },
{ id: 'mama', name: 'Mama', ini: 'M', color: '#D6EBDD' }
].map(function (p) { return Object.assign({}, p, { on: s.who === p.id, ring: s.who === p.id ? on : '#EEE6F8', pick: function () { self.setState({ who: p.id }); } }); });
var whats = [
{ id: 'inleveren', label: 'Inleveren', color: '#FFD6E3', icon: 'M12 3v12M7 10l5 5 5-5M5 21h14' },
{ id: 'maken', label: 'Maken', color: '#E6DBFF', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
{ id: 'bellen', label: 'Bellen', color: '#FFF1B8', icon: 'M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.7 2.8-1.8 3.4a16 16 0 0 0 6 6l3.4-1.8 2.8.7a2 2 0 0 1 1.7 2z' },
{ id: 'mailen', label: 'Mailen', color: '#D4E8FF', icon: 'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3.5 7l8.5 6 8.5-6' },
{ id: 'meenemen', label: 'Meenemen', color: '#D6EBDD', icon: 'M6 7h12l-1 13H7zM9 7a3 3 0 0 1 6 0' },
{ id: 'vragen', label: 'Vragen', color: '#FFE3CC', icon: 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V14M12 18h.01' }
].map(function (w) { return Object.assign({}, w, { on: s.what === w.id, ring: s.what === w.id ? on : off, pick: function () { self.setState({ what: w.id }); } }); });
var whens = [
{ id: 'vandaag', top: 'vandaag', big: '23' },
{ id: 'morgen', top: 'morgen', big: '24' },
{ id: 'ma', top: 'ma', big: '26' },
{ id: 'kies', top: 'kies', big: '...' }
].map(function (d) { return Object.assign({}, d, { on: s.when === d.id, ring: s.when === d.id ? on : off, pick: function () { self.setState({ when: d.id }); } }); });
return {
people: people,
whats: whats,
whens: whens,
remind: s.remind,
switchBg: s.remind ? '#3F9A64' : '#C9BFD6',
switchSide: s.remind ? 'flex-end' : 'flex-start',
toggleRemind: function () { self.setState({ remind: !s.remind }); },
photo: s.photo,
note: s.note,
notePh: s.listening ? 'ik luister…' : 'notitie (mag leeg)',
onNote: function (e) { self.setState({ note: e.target.value }); },
listen: function () {
var R = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!R) { self.setState({ note: 'Inspreken werkt niet in deze browser' }); return; }
var r = new R(); r.lang = 'nl-NL'; r.interimResults = false;
r.onresult = function (ev) { var t = ev.results[0][0].transcript; self.setState({ note: (self.state.note ? self.state.note + ' ' : '') + t }); };
r.onend = function () { self.setState({ listening: false }); };
r.onerror = function () { self.setState({ listening: false }); };
self.setState({ listening: true }); r.start();
},
saved: s.saved,
notSaved: !s.saved,
save: function () { self.setState({ saved: true }); },
hasPhoto: !!s.photo,
noPhoto: !s.photo,
onPhoto: function (e) { var f = e && e.target && e.target.files && e.target.files[0]; if (e && e.target) { e.target.value = ''; } if (!f) { return; } if (s.photo) { URL.revokeObjectURL(s.photo); } self.setState({ photo: URL.createObjectURL(f) }); },
removePhoto: function () { if (s.photo) { URL.revokeObjectURL(s.photo); } self.setState({ photo: '' }); }
};
}
}
</script>
</body>
</html>
