<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Klok-widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#3A3046}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 300px; box-sizing: border-box; background: linear-gradient(180deg, #F4B29C 0%, #F8CDB9 45%, #FBE6D9 100%); padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; font-family: 'Nunito', system-ui, sans-serif;">
<div style="font-size: 15px; font-weight: 800; color: #6B2E1C;">Startscherm · tik om te wisselen</div>
<div style="display: flex; gap: 16px;">

<sc-if value="{{isIn}}" hint-placeholder-val="{{true}}">
<button onClick="{{toggle}}" aria-label="Uitklokken" style="width: 167px; height: 200px; border: none; border-radius: 32px; background: #D6EBDD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(58,43,102,0.18);">
<span style="width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(160deg, #8CC7A0, #4F9168); border: 5px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #3F7A58;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
<span style="font-size: 20px; font-weight: 900; color: #FFFFFF;">UIT</span>
</span>
<span style="display: flex; flex-direction: column; align-items: center; line-height: 1.2;">
<span style="font-size: 15px; font-weight: 800; color: #2F5E43;">al 5½ uur gewerkt</span>
<span style="font-size: 13px; font-weight: 700; color: #3D5E4A;">sinds 7:45</span>
</span>
</button>
</sc-if>
<sc-if value="{{isOut}}" hint-placeholder-val="{{false}}">
<button onClick="{{toggle}}" aria-label="Inklokken" style="width: 167px; height: 200px; border: none; border-radius: 32px; background: #FFD6E3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(58,43,102,0.18);">
<span style="width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(160deg, #F29AB8, #CC4F80); border: 5px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #A93A66;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg>
<span style="font-size: 20px; font-weight: 900; color: #FFFFFF;">IN</span>
</span>
<span style="font-size: 15px; font-weight: 800; color: #7A2D4E;">nog niet gestart</span>
</button>
</sc-if>

<div style="width: 167px; height: 200px; border-radius: 32px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 8px 20px rgba(58,43,102,0.18);">
<svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="34 en een kwart van 35 uur">
<circle cx="50" cy="50" r="38" fill="none" stroke="#F1EBF8" stroke-width="14"></circle>
<circle cx="50" cy="50" r="38" fill="none" stroke="#B9A3F0" stroke-width="14" stroke-linecap="round" stroke-dasharray="230 239" transform="rotate(-90 50 50)"></circle>
</svg>
<span style="font-size: 30px; font-weight: 900; line-height: 1;">34¼</span>
<span style="font-size: 14px; font-weight: 800; color: #6B6078;">van 35 uur</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { isIn: true };
}
renderVals() {
return {
isIn: this.state.isIn,
isOut: !this.state.isIn,
toggle: () => this.setState({ isIn: !this.state.isIn })
};
}
}
</script>
</body>
</html>
