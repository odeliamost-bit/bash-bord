name: App bouwen

# Bouwt de app bij elke nieuwe code, draait de testjes en zet de nieuwste
# versie klaar op één vaste link (zie README: "App op je telefoon zetten").
#
# Beveiliging:
# - Elk hulpje staat vast op een precieze versie (de lange code achter @).
#   Dependabot meldt het als er een nieuwere is (.github/dependabot.yml).
# - Standaard mag het recept alleen lezen; alleen "klaarzetten" mag schrijven.
# - Bij een pull request wordt alleen gebouwd en getest, niks klaargezet.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-bouwen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Controleert ook of gradle-wrapper.jar echt van Gradle is.
      # "basic" = de openbare (open-source) cache, niet de gesloten variant.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Vaste handtekening klaarzetten (als die is ingesteld)
        env:
          APP_SLEUTEL: ${{ secrets.APP_SLEUTEL }}
        run: |
          if [ -n "$APP_SLEUTEL" ]; then
            echo "$APP_SLEUTEL" | base64 -d > "$RUNNER_TEMP/app.keystore"
            echo "SLEUTEL_PAD=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Geen APP_SLEUTEL ingesteld. Elke versie krijgt een andere handtekening; bij bijwerken gaan gegevens verloren."
          fi

      - name: Bouwen en testen
        env:
          SLEUTEL_WACHTWOORD: ${{ secrets.APP_SLEUTEL_WACHTWOORD }}
          # Sync: eigen Supabase-project. Leeg = de app bouwt zonder sync.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease testReleaseUnitTest --stacktrace

      - name: Controle — online alleen via online/, naar Open-Meteo en de eigen Supabase
        run: |
          # Netwerkcode mag alleen in Online.kt (weer) en Supabase.kt (sync) staan.
          buiten=$(grep -rlE "openConnection|HttpURLConnection|HttpsURLConnection|Socket\(|okhttp|io\.ktor|import java\.net\.URL$" app/src/main/java \
            | grep -vE "/online/(Online|Supabase)\.kt$" || true)
          if [ -n "$buiten" ]; then
            echo "::error::Netwerkcode buiten online/Online.kt en online/Supabase.kt gevonden: $buiten"
            exit 1
          fi
          # De sync mag alleen de onderdelen die Odelia koos. Uren, cyclus, mail, advies, weer en thuis: nooit.
          if ! grep -q 'val ONLINE = setOf("geld", "onthoud", "leren", "wensen", "recepten", "mensen", "fotos", "instellingen")' app/src/main/java/nl/odelia/dashboard/logica/SyncRegels.kt; then
            echo "::error::De lijst met online-onderdelen in SyncRegels.kt is veranderd. Pas deze controle (en CLAUDE.md) bewust mee aan."
            exit 1
          fi
          # En Online.kt mag alleen naar de weerdienst Open-Meteo.
          if ! grep -q 'TOEGESTAAN = setOf("api.open-meteo.com", "geocoding-api.open-meteo.com")' app/src/main/java/nl/odelia/dashboard/online/Online.kt; then
            echo "::error::De lijst met toegestane websites in Online.kt is veranderd. Pas deze controle bewust mee aan."
            exit 1
          fi

      - name: Controle — alleen bekende toestemmingen en geen testversie
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions "$apk" | tee rechten.txt
          # Alleen deze toestemmingen mogen erin. Iets nieuws (locatie, camera, contacten …)? Dan stopt de bouw.
          toegestaan="POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED INTERNET ACCESS_NETWORK_STATE WAKE_LOCK FOREGROUND_SERVICE DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for recht in $(grep "uses-permission" rechten.txt | sed -E "s/.*name='([^']*)'.*/\1/"); do
            kort="${recht##*.}"
            if ! echo " $toegestaan " | grep -q " $kort "; then
              echo "::error::Onbekende toestemming: $recht"
              exit 1
            fi
          done
          if "$aapt2" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::Dit is een testversie (debuggable). Die mag niet naar de telefoon."
            exit 1
          fi
          cp "$apk" mijn-dashboard.apk
          sha256sum mijn-dashboard.apk | tee mijn-dashboard.apk.sha256

      - name: Testverslag bewaren
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testverslag
          path: app/build/reports/tests/
          retention-days: 7

      - name: App bewaren voor de volgende stap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mijn-dashboard
          path: |
            mijn-dashboard.apk
            mijn-dashboard.apk.sha256
          retention-days: 7

  klaarzetten:
    needs: bouwen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Eén tegelijk, zodat twee builds niet door elkaar de link vervangen.
    concurrency:
      group: nieuwste-versie
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mijn-dashboard

      - name: Nieuwste versie klaarzetten
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          controle="$(cut -d' ' -f1 mijn-dashboard.apk.sha256)"
          gh release delete nieuwste --yes --cleanup-tag || true
          gh release create nieuwste mijn-dashboard.apk mijn-dashboard.apk.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nieuwste versie" \
            --notes "Gebouwd uit ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Open deze pagina op je telefoon en tik op mijn-dashboard.apk. Controlecode (SHA-256): ${controle}"
